services:
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ST_DATABASE_URL: postgresql+psycopg://stocktracker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/stocktracker
      ST_REDIS_URL: redis://redis:6379/0
      ST_MODE: ${ST_MODE:-demo}
      ST_ALPACA_KEY: ${ST_ALPACA_KEY:-}
      ST_ALPACA_SECRET: ${ST_ALPACA_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocktracker
      POSTGRES_DB: stocktracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktracker"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
