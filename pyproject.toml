[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "marketpulse"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "structlog>=24,<27", "websockets>=14,<17", "threadpoolctl>=3,<4"]
[project.optional-dependencies]
ml = ["xgboost>=2,<4"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.setuptools.packages.find]
include = ["core*", "ingestion*", "features*", "engine*", "api*", "paper*"]
[tool.setuptools.package-data]
api = ["*.html"]
paper = ["study_plan.json"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
