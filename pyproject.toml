[project]
name = "stocktracker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "pydantic-settings>=2,<3", "httpx>=0.27,<1", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "exchange-calendars>=4.6,<5"]
[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.48"]
nlp = ["transformers>=4.45,<5", "torch>=2.4"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["api*", "data_ingestion*", "models*", "matching_engine*"]
